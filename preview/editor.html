<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>M3E Card Editors</title>
    <style>
      :root {
        --bg: #fafafa;
        --fg: #4c4f69;
        --muted: #6c6f85;
        --bar: #eff1f5;
        --panel: #ffffff;
        --line: #dce0e8;
        color-scheme: light;
      }
      :root[data-theme='mocha'] {
        --bg: #11111b;
        --fg: #cdd6f4;
        --muted: #a6adc8;
        --bar: #181825;
        --panel: #1e1e2e;
        --line: #313244;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Noto Sans JP', system-ui, sans-serif;
        /* What HA's own editor exposes to custom editors. */
        --primary-text-color: var(--fg);
        --secondary-text-color: var(--muted);
        --divider-color: var(--line);
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        background: var(--bar);
        font-size: 13px;
      }
      header strong {
        font-size: 15px;
        font-weight: 600;
        margin-right: auto;
      }
      header a {
        color: var(--muted);
      }
      header button {
        font: inherit;
        border: 0;
        padding: 6px 14px;
        border-radius: 16px;
        background: #8839ef;
        color: #fff;
        cursor: pointer;
      }
      #rows {
        display: grid;
        gap: 24px;
        max-width: 880px;
        margin: 0 auto;
        padding: 24px 16px 64px;
      }
      .row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 24px;
        align-items: start;
      }
      /* Cards that fill their grid rows in HA would stretch to the editor's height here. */
      .row > :first-child {
        height: auto;
      }
      .panel {
        padding: 16px;
        border-radius: 16px;
        background: var(--panel);
        border: 1px solid var(--line);
      }
      .panel code {
        font-size: 12px;
        color: var(--muted);
      }
      @media (max-width: 720px) {
        .row {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <strong>M3E カードの編集画面</strong>
      <a href="./">カード一覧</a>
      <button id="theme" type="button">Latte (Light)</button>
    </header>
    <div id="rows"></div>
    <script type="module" src="./editor.ts"></script>
  </body>
</html>

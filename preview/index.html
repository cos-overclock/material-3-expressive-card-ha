<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Material 3 Expressive Card Preview</title>
    <style>
      :root {
        --bg: #fafafa;
        --fg: #4c4f69;
        --muted: #6c6f85;
        --bar: #eff1f5;
        color-scheme: light;
      }
      :root[data-theme='mocha'] {
        --bg: #11111b;
        --fg: #cdd6f4;
        --muted: #a6adc8;
        --bar: #181825;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Noto Sans JP', system-ui, sans-serif;
        transition: background-color 0.3s;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 20px;
        padding: 10px 16px;
        background: var(--bar);
        font-size: 13px;
      }
      header strong {
        font-size: 15px;
        font-weight: 600;
        margin-right: auto;
      }
      header button {
        font: inherit;
        border: 0;
        padding: 6px 14px;
        border-radius: 16px;
        background: #8839ef;
        color: #fff;
        cursor: pointer;
      }
      header label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
      }
      #sections {
        --section-count: 3;
        display: grid;
        grid-template-columns: repeat(var(--section-count), minmax(0, 400px));
        justify-content: center;
        gap: 24px;
        padding: 24px 16px 64px;
        align-items: start;
      }
      @media (max-width: 1300px) {
        #sections {
          --section-count: 2;
        }
      }
      @media (max-width: 860px) {
        #sections {
          --section-count: 1;
        }
      }
      .section {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        grid-auto-rows: minmax(56px, auto);
        gap: 8px;
        align-content: start;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Material 3 Expressive Card — プレビュー</strong>
      <label>応答の遅延 <input id="latency" type="range" min="0" max="1500" step="50" value="100" /> <span id="latency-value">100ms</span></label>
      <label
        >密度
        <select id="density">
          <option value="auto">自動（スマホ・タブレットでコンパクト）</option>
          <option value="compact">コンパクト</option>
          <option value="comfortable">標準</option>
        </select></label
      >
      <label><input id="controls" type="checkbox" checked /> 操作部（スライダー・プリセット・風量）</label>
      <label><input id="offline" type="checkbox" /> 通信失敗（履歴・統計・予定・予報）</label>
      <button id="theme" type="button">Latte (Light)</button>
    </header>
    <main id="sections"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

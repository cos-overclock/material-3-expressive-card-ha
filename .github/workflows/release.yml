# Pushing a v* tag builds dist/material-3-expressive-card.js and publishes a GitHub release with it
# attached, which is where HACS downloads it from. The tag must match package.json's version (v0.2.0).
# A tag with a suffix such as v0.3.0-beta.1 is published as a pre-release.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Tag $TAG does not match package.json version ($expected)"
            exit 1
          fi
      - run: npm run build
      - name: Create the release
        run: |
          asset=dist/material-3-expressive-card.js
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run, or a release drafted by hand: just replace the asset.
            gh release upload "$TAG" "$asset" --clobber
          else
            flags=()
            case "$TAG" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$TAG" "$asset" --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
          fi
